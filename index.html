<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Дарк-кухня — заказ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --surface:#26241F;
    --surface-2:#302D26;
    --text:#F5EFE6;
    --text-dim:#B8B0A1;
    --amber:#F4A227;
    --amber-dark:#C87F13;
    --basil:#7FA653;
    --line:#3A362E;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{padding-bottom:96px;}
  h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;}

  header{
    padding:20px 18px 14px;
    position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .brand{font-size:22px; font-weight:700; margin:0 0 2px; display:flex; align-items:center; gap:8px;}
  .brand span.tag{
    font-family:'Inter',sans-serif; font-weight:600; font-size:11px;
    color:var(--bg); background:var(--amber);
    padding:3px 8px; border-radius:20px; letter-spacing:.02em;
  }
  .subtitle{color:var(--text-dim); font-size:13.5px; margin:0;}

  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 16px; border-radius:20px;
    background:var(--surface); color:var(--text-dim);
    font-size:13.5px; font-weight:600; white-space:nowrap;
    border:1px solid var(--line); cursor:pointer;
  }
  .tab.active{background:var(--amber); color:#1C1B19; border-color:var(--amber);}

  main{padding:6px 18px 10px;}
  .category-title{
    font-size:19px; font-weight:600; margin:22px 0 12px;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; display:flex; flex-direction:column;
  }
  .card-emoji{
    font-size:38px; text-align:center;
    background:var(--surface-2); border-radius:12px;
    padding:14px 0; margin-bottom:10px;
  }
  .card-name{font-size:14.5px; font-weight:600; line-height:1.25; margin:0 0 4px;}
  .card-desc{font-size:11.5px; color:var(--text-dim); line-height:1.35; margin:0 0 10px; flex:1;}
  .card-row{display:flex; align-items:center; justify-content:space-between;}
  .price{font-weight:700; font-size:14.5px; color:var(--amber);}

  .qty-controls{display:flex; align-items:center; gap:8px;}
  .qty-btn{
    width:28px; height:28px; border-radius:9px; border:none;
    background:var(--surface-2); color:var(--text); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .qty-btn.add{background:var(--amber); color:#1C1B19;}
  .qty-val{min-width:16px; text-align:center; font-weight:700; font-size:14px;}

  .cart-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -8px 24px rgba(0,0,0,.35);
    transform:translateY(100%); transition:transform .25s ease;
    max-height:82vh; display:flex; flex-direction:column;
  }
  .cart-sheet.open{transform:translateY(0);}
  .sheet-handle{width:40px; height:4px; background:var(--line); border-radius:4px; margin:10px auto;}
  .sheet-header{padding:0 20px 8px; display:flex; justify-content:space-between; align-items:center;}
  .sheet-header h2{margin:0; font-size:19px;}
  .close-sheet{background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; line-height:1;}
  .cart-items{overflow-y:auto; padding:0 20px; flex:1;}
  .cart-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .cart-row-name{font-size:14px; font-weight:600;}
  .cart-row-price{font-size:12.5px; color:var(--text-dim);}
  .cart-note{padding:14px 20px 4px;}
  .cart-note textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; color:var(--text); font-family:inherit; font-size:13.5px;
    padding:10px 12px; resize:none; min-height:56px;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px 20px; font-size:15px; font-weight:700;
  }
  .empty-cart{color:var(--text-dim); text-align:center; padding:30px 0; font-size:13.5px;}

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, var(--bg) 30%);
  }
  .cart-btn{
    width:100%; border:none; border-radius:16px; padding:15px;
    background:var(--amber); color:#1C1B19; font-weight:700; font-size:15px;
    font-family:'Fredoka',sans-serif;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
  }
  .cart-btn:disabled{opacity:.4;}
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .backdrop.show{opacity:1; pointer-events:auto;}

  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background:var(--basil); color:#fff; font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:12px; opacity:0; transition:all .25s ease; z-index:30;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="brand">🔥 Дым&nbsp;и&nbsp;Дым <span class="tag">DARK KITCHEN</span></div>
  <p class="subtitle">Соберём заказ за пару тапов — доставим за 30–40 минут</p>
</header>

<div class="tabs" id="tabs"></div>
<main id="menu"></main>

<div class="backdrop" id="backdrop"></div>
<div class="cart-sheet" id="cartSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h2>Ваш заказ</h2>
    <button class="close-sheet" id="closeSheet">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-note">
    <textarea id="orderComment" placeholder="Комментарий к заказу (адрес, этаж, домофон...)"></textarea>
  </div>
  <div class="cart-total">
    <span>Итого</span>
    <span id="cartTotal">0 ₽</span>
  </div>
</div>

<div class="bottom-bar">
  <button class="cart-btn" id="openCartBtn" disabled>
    <span id="cartBtnLabel">Корзина пуста</span>
    <span id="cartBtnTotal"></span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------
  // Telegram WebApp init (falls back gracefully in a normal browser)
  // ---------------------------------------------------------
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if(tg){
    tg.ready();
    tg.expand();
    if(tg.themeParams){
      const root = document.documentElement.style;
      if(tg.themeParams.bg_color) root.setProperty('--bg', tg.themeParams.bg_color);
    }
  }

  // ---------------------------------------------------------
  // Menu data — отредактируй под своё заведение
  // ---------------------------------------------------------
  const MENU = {
    "Бургеры": [
      {id:'b1', name:'Дымный чизбургер', desc:'Говяжья котлета, чеддер, копчёный соус, маринованные огурцы', price:390, emoji:'🍔'},
      {id:'b2', name:'Острый techas', desc:'Двойная котлета, халапеньо, начос-соус', price:450, emoji:'🌶️'},
      {id:'b3', name:'Куриный кранч', desc:'Хрустящее филе, слоу, ранч-соус', price:360, emoji:'🍗'},
    ],
    "Боулы": [
      {id:'w1', name:'Боул с лососем', desc:'Рис, лосось гриль, авокадо, эдамаме', price:490, emoji:'🥗'},
      {id:'w2', name:'Тёплый боул с говядиной', desc:'Булгур, говядина, овощи гриль', price:420, emoji:'🍲'},
    ],
    "Напитки": [
      {id:'d1', name:'Лимонад домашний', desc:'Мята, лайм, имбирь', price:180, emoji:'🥤'},
      {id:'d2', name:'Молочный коктейль', desc:'Ваниль или шоколад', price:220, emoji:'🥛'},
      {id:'d3', name:'Чёрный кофе', desc:'Свежая обжарка', price:150, emoji:'☕'},
    ],
    "Десерты": [
      {id:'s1', name:'Чизкейк дня', desc:'Меняется каждый день, спроси на кассе', price:250, emoji:'🍰'},
      {id:'s2', name:'Брауни с мороженым', desc:'Тёплый брауни, ванильное мороженое', price:270, emoji:'🍫'},
    ]
  };

  const cart = {}; // id -> {item, qty}

  // ---------------------------------------------------------
  // Render tabs + menu
  // ---------------------------------------------------------
  const tabsEl = document.getElementById('tabs');
  const menuEl = document.getElementById('menu');
  const categories = Object.keys(MENU);

  categories.forEach((cat, i)=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===0 ? ' active' : '');
    tab.textContent = cat;
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('cat-'+i).scrollIntoView({behavior:'smooth', block:'start'});
    });
    tabsEl.appendChild(tab);
  });

  categories.forEach((cat, i)=>{
    const section = document.createElement('section');
    section.id = 'cat-'+i;
    const title = document.createElement('h3');
    title.className = 'category-title';
    title.textContent = cat;
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'grid';
    MENU[cat].forEach(item=>{
      grid.appendChild(renderCard(item));
    });
    section.appendChild(grid);
    menuEl.appendChild(section);
  });

  function renderCard(item){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-emoji">${item.emoji}</div>
      <p class="card-name">${item.name}</p>
      <p class="card-desc">${item.desc}</p>
      <div class="card-row">
        <span class="price">${item.price} ₽</span>
        <div class="qty-controls" id="qty-${item.id}"></div>
      </div>
    `;
    renderQtyControls(item);
    return card;
  }

  function renderQtyControls(item){
    const el = document.getElementById('qty-'+item.id);
    if(!el) return;
    const qty = cart[item.id] ? cart[item.id].qty : 0;
    if(qty === 0){
      el.innerHTML = `<button class="qty-btn add" data-id="${item.id}">+</button>`;
    } else {
      el.innerHTML = `
        <button class="qty-btn" data-action="minus" data-id="${item.id}">−</button>
        <span class="qty-val">${qty}</span>
        <button class="qty-btn add" data-action="plus" data-id="${item.id}">+</button>
      `;
    }
  }

  function findItem(id){
    for(const cat of categories){
      const found = MENU[cat].find(i=>i.id===id);
      if(found) return found;
    }
    return null;
  }

  menuEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.qty-btn');
    if(!btn) return;
    const id = btn.dataset.id;
    const item = findItem(id);
    if(!item) return;
    const action = btn.dataset.action || 'plus';

    if(!cart[id]) cart[id] = {item, qty:0};
    if(action === 'plus'){ cart[id].qty++; haptic('light'); }
    if(action === 'minus'){ cart[id].qty--; haptic('light'); if(cart[id].qty<=0) delete cart[id]; }

    renderQtyControls(item);
    updateCartBar();
  });

  function haptic(style){
    if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
  }

  // ---------------------------------------------------------
  // Cart bar + sheet
  // ---------------------------------------------------------
  const openCartBtn = document.getElementById('openCartBtn');
  const cartBtnLabel = document.getElementById('cartBtnLabel');
  const cartBtnTotal = document.getElementById('cartBtnTotal');
  const cartSheet = document.getElementById('cartSheet');
  const backdrop = document.getElementById('backdrop');
  const cartItemsEl = document.getElementById('cartItems');
  const cartTotalEl = document.getElementById('cartTotal');

  function cartCount(){ return Object.values(cart).reduce((s,c)=>s+c.qty,0); }
  function cartSum(){ return Object.values(cart).reduce((s,c)=>s+c.qty*c.item.price,0); }

  function updateCartBar(){
    const count = cartCount();
    const sum = cartSum();
    if(count === 0){
      openCartBtn.disabled = true;
      cartBtnLabel.textContent = 'Корзина пуста';
      cartBtnTotal.textContent = '';
    } else {
      openCartBtn.disabled = false;
      cartBtnLabel.textContent = `Корзина · ${count} ${pluralize(count)}`;
      cartBtnTotal.textContent = sum + ' ₽';
    }
    renderCartSheet();
  }

  function pluralize(n){
    const mod10 = n%10, mod100 = n%100;
    if(mod10===1 && mod100!==11) return 'товар';
    if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'товара';
    return 'товаров';
  }

  function renderCartSheet(){
    cartItemsEl.innerHTML = '';
    const entries = Object.values(cart);
    if(entries.length === 0){
      cartItemsEl.innerHTML = '<div class="empty-cart">Пока пусто — выберите что-нибудь вкусное 🙂</div>';
    } else {
      entries.forEach(({item, qty})=>{
        const row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML = `
          <div>
            <div class="cart-row-name">${item.emoji} ${item.name}</div>
            <div class="cart-row-price">${qty} × ${item.price} ₽</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" data-action="minus" data-id="${item.id}">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn add" data-action="plus" data-id="${item.id}">+</button>
          </div>
        `;
        cartItemsEl.appendChild(row);
      });
    }
    cartTotalEl.textContent = cartSum() + ' ₽';
    updateMainButton();
  }

  cartItemsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.qty-btn');
    if(!btn) return;
    const id = btn.dataset.id;
    const item = findItem(id);
    const action = btn.dataset.action;
    if(!cart[id]) cart[id] = {item, qty:0};
    if(action==='plus') cart[id].qty++;
    if(action==='minus'){ cart[id].qty--; if(cart[id].qty<=0) delete cart[id]; }
    renderQtyControls(item);
    updateCartBar();
  });

  function openSheet(){
    cartSheet.classList.add('open');
    backdrop.classList.add('show');
  }
  function closeSheetFn(){
    cartSheet.classList.remove('open');
    backdrop.classList.remove('show');
  }
  openCartBtn.addEventListener('click', openSheet);
  document.getElementById('closeSheet').addEventListener('click', closeSheetFn);
  backdrop.addEventListener('click', closeSheetFn);

  // ---------------------------------------------------------
  // Telegram MainButton = "Оформить заказ"
  // ---------------------------------------------------------
  function updateMainButton(){
    if(!tg) return;
    const count = cartCount();
    if(count > 0){
      tg.MainButton.setText(`Оформить заказ · ${cartSum()} ₽`);
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }

  function submitOrder(){
    const count = cartCount();
    if(count === 0) return;
    const items = Object.values(cart).map(({item, qty})=>({
      id:item.id, name:item.name, price:item.price, qty
    }));
    const payload = {
      items,
      total: cartSum(),
      comment: document.getElementById('orderComment').value.trim(),
      ts: Date.now()
    };

    if(tg && tg.sendData){
      tg.MainButton.showProgress();
      tg.sendData(JSON.stringify(payload));
      // Telegram closes the Mini App automatically after sendData in most clients
    } else {
      // Fallback for testing in a regular browser
      showToast('Заказ отправлен (демо-режим, вне Telegram)');
      console.log('ORDER PAYLOAD', payload);
    }
  }

  if(tg){
    tg.onEvent('mainButtonClicked', submitOrder);
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  updateCartBar();
})();
</script>
</body>
</html>
